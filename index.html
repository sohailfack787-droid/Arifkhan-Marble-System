  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyBzL7ToAxAIAdRUY9mhJg_ChTfGjKXmTdY",
      authDomain: "yousaf-khan-marble.firebaseapp.com",
      databaseURL: "https://yousaf-khan-marble-default-rtdb.firebaseio.com",
      projectId: "yousaf-khan-marble",
      storageBucket: "yousaf-khan-marble.firebasestorage.app",
      messagingSenderId: "348715247959",
      appId: "1:348715247959:web:f562d0f778657d6bee3612",
      measurementId: "G-2M87407HCW"
    };
    const SUPERVISOR_PIN = "1234";
    const ADVANCE_STORAGE_KEY = "yousaf_marble_worker_advances_v5";
    const ROSTER_STORAGE_KEY = "yousaf_marble_roster_v5";
    const CYCLE_STORAGE_KEY = "yousaf_marble_cycle_v5";
    const SLOT_DEFS = [
      { key: "vert_ustad", inputId: "slot_vert_ustad", label: "ورٹیکل استاد", group: "joint4" },
      { key: "vert_helper", inputId: "slot_vert_helper", label: "ورٹیکل ہیلپر", group: "joint4" },
      { key: "athara_ustad", inputId: "slot_athara_ustad", label: "اٹھارہ استاد", group: "joint4" },
      { key: "athara_helper", inputId: "slot_athara_helper", label: "اٹھارہ ہیلپر", group: "joint4" },
      { key: "section_1", inputId: "slot_section_1", label: "سیکشن مزدور 1", group: "سیکشن" },
      { key: "section_2", inputId: "slot_section_2", label: "سیکشن مزدور 2", group: "سیکشن" },
      { key: "resize_1", inputId: "slot_resize_1", label: "ریسائز مزدور 1", group: "ریسائز" },
      { key: "resize_2", inputId: "slot_resize_2", label: "ریسائز مزدور 2", group: "ریسائز" }
    ];
    const todayStr = new Date().toISOString().split("T")[0];
    function getDefaultCycleStart() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      const d = now.getDate();
      const start = d >= 5 ? new Date(y, m, 5) : new Date(y, m - 1, 5);
      return start.toISOString().split("T")[0];
    }
    function createEmptySlots() {
      const s = {};
      SLOT_DEFS.forEach((d) => { s[d.key] = { name: "", startDate: "", endDate: "", active: true, history: [] }; });
      return s;
    }
    let isUnlocked = false;
    let latestProduction = {};
    let latestSecrets = {};
    let workerAdvances = JSON.parse(localStorage.getItem(ADVANCE_STORAGE_KEY) || "{}");
    let rosterData = JSON.parse(localStorage.getItem(ROSTER_STORAGE_KEY) || "null") || { slots: createEmptySlots() };
    rosterData.slots = { ...createEmptySlots(), ...(rosterData.slots || {}) };
    let cycleData = JSON.parse(localStorage.getItem(CYCLE_STORAGE_KEY) || "null") || { cycleStartDate: getDefaultCycleStart(), fifthStatements: [] };
    if (!cycleData.cycleStartDate) cycleData.cycleStartDate = getDefaultCycleStart();
    if (!Array.isArray(cycleData.fifthStatements)) cycleData.fifthStatements = [];
    let latestComputedSnapshot = { cycleStartDate: cycleData.cycleStartDate, totalFeet: 0, totalWage: 0, totalFactoryPayable: 0, totalWorkerOwes: 0, workers: [] };
    let reportText = "";
    const dateInput = document.getElementById("entryDate");
    if (dateInput && !dateInput.value) dateInput.value = todayStr;
    const startInput = document.getElementById("rosterStartDate");
    if (startInput && !startInput.value) startInput.value = todayStr;
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const prodRef = ref(db, "marbleFactory/production");
    const secretRef = ref(db, "marbleFactory/secretComplaints");
    const rosterRef = ref(db, "marbleFactory/roster");
    const cycleRef = ref(db, "marbleFactory/billingCycle");
    const statusEl = document.getElementById("dbStatus");
    const toastEl = document.getElementById("toast");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      setTimeout(() => { toastEl.style.display = "none"; }, 2800);
    }
    function getSettlementInfo(wage, paid) {
      const diff = Math.round(wage - paid);
      if (diff > 0) return { type: "factory_owes", amount: diff, css: "settle-factory-owes", text: `فیکٹری پر مزدور کے ${diff.toLocaleString()} روپے بقایا (واجب الادا) ہیں` };
      if (diff < 0) {
        const absVal = Math.abs(diff);
        return { type: "worker_owes", amount: absVal, css: "settle-worker-owes", text: `مزدور کے ذمے فیکٹری کے ${absVal.toLocaleString()} روپے بقایا (واپس لینے ہیں)` };
      }
      return { type: "even", amount: 0, css: "settle-even", text: "حساب بالکل برابر ہے (0 روپے بقایا)" };
    }
    function populateSlotInputs() {
      SLOT_DEFS.forEach((def) => {
        const inp = document.getElementById(def.inputId);
        const slot = rosterData.slots[def.key] || {};
        if (inp) inp.value = slot.name || "";
      });
    }
    function persistRoster() {
      localStorage.setItem(ROSTER_STORAGE_KEY, JSON.stringify(rosterData));
      set(rosterRef, rosterData).catch(() => {});
    }
    function persistCycle() {
      localStorage.setItem(CYCLE_STORAGE_KEY, JSON.stringify(cycleData));
      set(cycleRef, cycleData).catch(() => {});
    }
    function isWorkerEligibleOnDate(person, entryDate) {
      if (!person || !person.name) return false;
      const d = entryDate || todayStr;
      if (person.startDate && d < person.startDate) return false;
      if (person.endDate && d > person.endDate) return false;
      return true;
    }
    function isEntryInCurrentCycle(entryDate) {
      const d = entryDate || todayStr;
      if (cycleData.cycleStartDate && d < cycleData.cycleStartDate) return false;
      return true;
    }
    function calculateSlotEarnings(slotKey) {
      let feet = 0;
      let wage = 0;
      Object.values(latestProduction).forEach((item) => {
        const f = Number(item.feet || 0);
        const w = Number(item.wage || 0);
        const m = item.machine || "";
        const d = item.entryDate || todayStr;
        if (!isEntryInCurrentCycle(d)) return;
        if ((m === "ورٹیکل" || m === "اٹھارہ") && ["vert_ustad", "vert_helper", "athara_ustad", "athara_helper"].includes(slotKey)) {
          const jointKeys = ["vert_ustad", "vert_helper", "athara_ustad", "athara_helper"];
          const activeJoint = jointKeys.filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], d));
          if (activeJoint.includes(slotKey)) {
            const div = activeJoint.length > 0 ? activeJoint.length : 4;
            feet += f / div;
            wage += w / div;
          }
        } else if (m === "سیکشن" && ["section_1", "section_2"].includes(slotKey)) {
          const secKeys = ["section_1", "section_2"];
          const activeSec = secKeys.filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], d));
          if (activeSec.includes(slotKey)) {
            const div = activeSec.length > 0 ? activeSec.length : 1;
            feet += f / div;
            wage += w / div;
          }
        } else if (m === "ریسائز" && ["resize_1", "resize_2"].includes(slotKey)) {
          const resKeys = ["resize_1", "resize_2"];
          const activeRes = resKeys.filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], d));
          if (activeRes.includes(slotKey)) {
            const div = activeRes.length > 0 ? activeRes.length : 1;
            feet += f / div;
            wage += w / div;
          }
        }
      });
      return { feet, wage };
    }
    window.saveAllSlots = function () {
      const chosenStart = document.getElementById("rosterStartDate").value || "";
      SLOT_DEFS.forEach((def) => {
        const inp = document.getElementById(def.inputId);
        const newName = (inp ? inp.value : "").trim();
        const current = rosterData.slots[def.key] || { name: "", startDate: "", endDate: "", active: true, history: [] };
        if (newName && current.name && newName !== current.name && current.active) {
          const earned = calculateSlotEarnings(def.key);
          const advKey = `${def.key}_${current.name}`;
          const paid = Number(workerAdvances[advKey] || 0);
          const settle = getSettlementInfo(earned.wage, paid);
          current.history = current.history || [];
          current.history.push({ name: current.name, startDate: current.startDate || "", endDate: chosenStart || todayStr, wage: Math.round(earned.wage), paid, settlementText: settle.text });
          current.name = newName;
          current.startDate = chosenStart || "";
          current.endDate = "";
          current.active = true;
        } else {
          current.name = newName;
          if (chosenStart) current.startDate = chosenStart;
          if (newName) current.active = true;
        }
        rosterData.slots[def.key] = current;
      });
      persistRoster();
      computeSummary();
      showToast("مزدوروں کے نام محفوظ ہو گئے!");
    };
    window.stopSlotWorker = function (slotKey) {
      const slot = rosterData.slots[slotKey];
      if (!slot || !slot.name) return;
      const stopDateInput = document.getElementById("stopDate-" + slotKey);
      const stopDate = (stopDateInput && stopDateInput.value) ? stopDateInput.value : todayStr;
      slot.endDate = stopDate;
      slot.active = false;
      rosterData.slots[slotKey] = slot;
      persistRoster();
      computeSummary();
      const earned = calculateSlotEarnings(slotKey);
      const paid = Number(workerAdvances[`${slotKey}_${slot.name}`] || 0);
      const settle = getSettlementInfo(earned.wage, paid);
      showToast(`${slot.name} اسٹاپ: ${settle.text}`);
    };
    window.startNewSlotWorker = function (slotKey) {
      const nameInput = document.getElementById("newName-" + slotKey);
      const startDateInput = document.getElementById("newStart-" + slotKey);
      const newName = (nameInput ? nameInput.value : "").trim();
      const newStart = (startDateInput && startDateInput.value) ? startDateInput.value : todayStr;
      if (!newName) { showToast("براہِ کرم نئے مزدور کا نام لکھیں۔"); return; }
      const slot = rosterData.slots[slotKey];
      slot.history = slot.history || [];
      if (slot.name) {
        const earned = calculateSlotEarnings(slotKey);
        const paid = Number(workerAdvances[`${slotKey}_${slot.name}`] || 0);
        const settle = getSettlementInfo(earned.wage, paid);
        slot.history.push({ name: slot.name, startDate: slot.startDate || "", endDate: slot.endDate || newStart, wage: Math.round(earned.wage), paid, settlementText: settle.text });
      }
      slot.name = newName;
      slot.startDate = newStart;
      slot.endDate = "";
      slot.active = true;
      rosterData.slots[slotKey] = slot;
      persistRoster();
      populateSlotInputs();
      computeSummary();
      showToast(`${newName} کا حساب ${newStart} سے شروع ہو گیا!`);
    };
    window.completeFifthDateSettlement = function () {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      const d = now.getDate();
      const nextFifth = d <= 5 ? new Date(y, m, 5) : new Date(y, m + 1, 5);
      const fifthDateStr = nextFifth.toISOString().split("T")[0];
      const statement = {
        id: "fifth_" + Date.now(),
        fifthDate: fifthDateStr,
        closedAt: new Date().toLocaleString("ur-PK"),
        cycleStartDate: cycleData.cycleStartDate,
        totalFeet: latestComputedSnapshot.totalFeet,
        totalWage: latestComputedSnapshot.totalWage,
        totalFactoryPayable: latestComputedSnapshot.totalFactoryPayable,
        totalWorkerOwes: latestComputedSnapshot.totalWorkerOwes,
        workers: latestComputedSnapshot.workers
      };
      cycleData.fifthStatements = [statement, ...(cycleData.fifthStatements || [])];
      const nextCycleStart = new Date(nextFifth.getFullYear(), nextFifth.getMonth(), nextFifth.getDate() + 1).toISOString().split("T")[0];
      cycleData.cycleStartDate = nextCycleStart;
      workerAdvances = {};
      localStorage.setItem(ADVANCE_STORAGE_KEY, JSON.stringify(workerAdvances));
      persistCycle();
      computeSummary();
      showToast(`5 تاریخ (${fifthDateStr}) کا مکمل حساب محفوظ ہو گیا! نیا سائیکل ${nextCycleStart} سے شروع۔`);
    };
    window.switchTab = function (tabName, btnEl) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + tabName).classList.add("active");
      btnEl.classList.add("active");
    };
    document.getElementById("prodForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const machine = document.getElementById("machineName").value;
      const entryDate = document.getElementById("entryDate").value || todayStr;
      const feet = parseFloat(document.getElementById("footage").value) || 0;
      const rate = parseFloat(document.getElementById("ratePerFoot").value) || 0;
      const wage = feet * rate;
      await push(prodRef, { machine, entryDate, feet, rate, wage, createdAt: new Date().toLocaleString("ur-PK") });
      e.target.reset();
      document.getElementById("entryDate").value = entryDate;
      showToast("روزانہ پروڈکشن ریکارڈ جمع ہو گیا!");
    });
    function renderFifthHistory() {
      const box = document.getElementById("fifthHistoryList");
      const list = cycleData.fifthStatements || [];
      if (!list.length) {
        box.innerHTML = "<p class='record-meta'>ابھی کوئی 5 تاریخ کا حساب بند نہیں کیا گیا۔ جب 5 تاریخ کا حساب مکمل کرنا ہو تو اوپر بٹن دبائیں۔</p>";
        return;
      }
      box.innerHTML = list.map((st) => {
        const wLines = (st.workers || []).map((w) => `• <strong>${w.name}</strong> (${w.role}): ${w.feet.toFixed(1)} فٹ | اجرت ${Math.round(w.wage).toLocaleString()} | ایڈوانس ${w.paid.toLocaleString()} — <span>${w.settlementText}</span>`).join("<br/>");
        return `
          <div class="worker-card">
            <div class="worker-head">
              <div><strong style="color:#38bdf8;">5 تاریخ کا مکمل حساب (${st.fifthDate})</strong><span class="record-meta"> — دورانیہ: ${st.cycleStartDate} تا ${st.fifthDate}</span></div>
              <span class="badge-active">مکمل شدہ</span>
            </div>
            <div style="margin-bottom:8px;">
              <span>کل فٹ: <strong>${Number(st.totalFeet || 0).toLocaleString()}</strong></span> |
              <span>کل اجرت: <strong>${Math.round(st.totalWage || 0).toLocaleString()} روپے</strong></span> |
              <span>فیکٹری بقایا: <strong>${Math.round(st.totalFactoryPayable || 0).toLocaleString()} روپے</strong></span> |
              <span>مزدور بقایا: <strong>${Math.round(st.totalWorkerOwes || 0).toLocaleString()} روپے</strong></span>
            </div>
            <div class="record-meta">${wLines || "مزدور کا ریکارڈ موجود نہیں"}</div>
            <div class="record-meta" style="margin-top:6px;">محفوظ ہونے کا وقت: ${st.closedAt || ""}</div>
          </div>
        `;
      }).join("");
    }

    function computeSummary() {
      const entries = Object.entries(latestProduction).reverse();
      let totalFeet = 0;
      let totalWage = 0;
      let totalFactoryPayable = 0;
      let totalWorkerOwes = 0;
      const byMachine = { "ورٹیکل": 0, "اٹھارہ": 0, "سیکشن": 0, "ریسائز": 0 };
      const slotStats = {};
      SLOT_DEFS.forEach((def) => { slotStats[def.key] = { feet: 0, wage: 0 }; });
      entries.forEach(([, item]) => {
        const feet = Number(item.feet || 0);
        const wage = Number(item.wage || 0);
        const machine = item.machine || "";
        const entryDate = item.entryDate || todayStr;
        if (!isEntryInCurrentCycle(entryDate)) return;
        totalFeet += feet;
        totalWage += wage;
        if (byMachine[machine] !== undefined) byMachine[machine] += feet;
        if (machine === "ورٹیکل" || machine === "اٹھارہ") {
          const jointKeys = ["vert_ustad", "vert_helper", "athara_ustad", "athara_helper"];
          const activeJoint = jointKeys.filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], entryDate));
          const divisor = activeJoint.length > 0 ? activeJoint.length : 4;
          activeJoint.forEach((k) => { slotStats[k].feet += feet / divisor; slotStats[k].wage += wage / divisor; });
        } else if (machine === "سیکشن") {
          const secKeys = ["section_1", "section_2"];
          const activeSec = secKeys.filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], entryDate));
          const divisor = activeSec.length > 0 ? activeSec.length : 1;
          activeSec.forEach((k) => { slotStats[k].feet += feet / divisor; slotStats[k].wage += wage / divisor; });
        } else if (machine === "ریسائز") {
          const resKeys = ["resize_1", "resize_2"];
          const activeRes = resKeys.filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], entryDate));
          const divisor = activeRes.length > 0 ? activeRes.length : 1;
          activeRes.forEach((k) => { slotStats[k].feet += feet / divisor; slotStats[k].wage += wage / divisor; });
        }
      });
      const jointFeet = (byMachine["ورٹیکل"] || 0) + (byMachine["اٹھارہ"] || 0);
      const secActiveCount = ["section_1", "section_2"].filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], todayStr)).length || 1;
      const resActiveCount = ["resize_1", "resize_2"].filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], todayStr)).length || 1;
      document.getElementById("cycleInfoBanner").textContent = `موجودہ جمع شدہ سائیکل شروع: ${cycleData.cycleStartDate} — اگلا مکمل تصفیہ ہر مہینے کی 5 تاریخ کو`;
      document.getElementById("totalFeet").textContent = totalFeet.toLocaleString();
      document.getElementById("totalWage").textContent = Math.round(totalWage).toLocaleString();
      document.getElementById("machineBreakdown").innerHTML = `
        <div class="record-item">
          <div><strong>ورٹیکل + اٹھارہ (مشترکہ ٹھیکہ — 4 حصے)</strong><br/><span class="record-meta">ورٹیکل: ${(byMachine["ورٹیکل"] || 0).toLocaleString()} فٹ | اٹھارہ: ${(byMachine["اٹھارہ"] || 0).toLocaleString()} فٹ</span></div>
          <div><strong>${jointFeet.toLocaleString()} فٹ</strong> <span class="record-meta">(فی بندہ کل حصہ: ${(jointFeet / 4).toFixed(1)} فٹ)</span></div>
        </div>
        <div class="record-item"><span><strong>سیکشن</strong> <span class="record-meta">(فعال مزدور: ${secActiveCount})</span></span><span>${(byMachine["سیکشن"] || 0).toLocaleString()} فٹ</span></div>
        <div class="record-item"><span><strong>ریسائز</strong> <span class="record-meta">(فعال مزدور: ${resActiveCount})</span></span><span>${(byMachine["ریسائز"] || 0).toLocaleString()} فٹ</span></div>
      `;
      const reportLines = [];
      const snapshotWorkers = [];
      document.getElementById("workerBreakdown").innerHTML = SLOT_DEFS.map((def) => {
        const slot = rosterData.slots[def.key] || { name: "", startDate: "", endDate: "", active: true, history: [] };
        const hasHistory = slot.history && slot.history.length > 0;
        if (!slot.name && !hasHistory && (def.key === "section_2" || def.key === "resize_2")) return "";
        const displayName = slot.name || "(نام درج نہیں)";
        const st = slotStats[def.key] || { feet: 0, wage: 0 };
        const advKey = `${def.key}_${displayName}`;
        const paid = Number(workerAdvances[advKey] || 0);
        const settle = getSettlementInfo(st.wage, paid);
        if (slot.name) {
          if (settle.type === "factory_owes") totalFactoryPayable += settle.amount;
          if (settle.type === "worker_owes") totalWorkerOwes += settle.amount;
          snapshotWorkers.push({ name: displayName, role: def.label, feet: st.feet, wage: st.wage, paid, settlementText: settle.text });
        }
        const isStopped = Boolean(slot.endDate) || slot.active === false;
        const statusBadge = isStopped ? `<span class="badge-stopped">کام چھوڑ چکا (آخری تاریخ: ${slot.endDate ||"اسٹاپ")</span>` : `<span class="badge-active">فعال${slot.startDate ? ` (شروع: ${slot.startDate})` : ""}</span>`;
        const shareNote = def.group === "joint4" ? " (ورٹیکل+اٹھارہ کا 1/4 حصہ)" : ` (${def.group} — فعال مزدوروں پر تقسیم)`;
        if (slot.name) reportLines.push(`• ${displayName} [${def.label}]: ${st.feet.toFixed(1)} فٹ | اجرت ${Math.round(st.wage).toLocaleString()} | ایڈوانس ${paid.toLocaleString()} | ${settle.text} ${isStopped ? "[اسٹاپ]" : "[فعال]"}`);
        const pastHtml = hasHistory ? `<div class="record-meta" style="margin-top:8px; padding-top:6px; border-top:1px dashed var(--border);"><strong>سابقہ مزدوروں کا تصفیہ:</strong><br/>${slot.history.map(h => `• ${h.name} (${h.startDate || "-"} تا ${h.endDate || "-"}): اجرت ${(h.wage || 0).toLocaleString()} | ایڈوانس ${(h.paid || 0).toLocaleString()} — <strong>${h.settlementText || ""}</strong>`).join("<br/>")}</div>` : "";
        return `
          <div class="worker-card">
            <div class="worker-head">
              <div><strong style="font-size:1.02rem;">${displayName}</strong><span class="record-meta"> — ${def.label}${shareNote}</span></div>
              ${statusBadge}
            </div>
            <div style="margin-bottom:8px;">
              <span>جمع کام: <strong>${st.feet.toFixed(1)} فٹ</strong></span> |
              <span>کل اجرت: <strong>${Math.round(st.wage).toLocaleString()} روپے</strong></span> |
              <span>ایڈوانس/ادا: <strong>${paid.toLocaleString()} روپے</strong></span>
            </div>
            <div class="settlement-box ${settle.css}">${settle.text}</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
              <input type="number" min="0" step="1" id="adv-${encodeURIComponent(advKey)}" value="${paid}" style="width:130px; padding:6px 8px;" placeholder="ایڈوانس/ادا" />
              <button type="button" class="btn-secondary" onclick="saveWorkerAdvance('${encodeURIComponent(advKey)}')">ایڈوانس محفوظ</button>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding-top:8px; border-top:1px solid var(--border);">
              <span class="record-meta">کام چھوڑنے کی تاریخ:</span>
              <input type="date" id="stopDate-${def.key}" value="${slot.endDate || todayStr}" style="width:150px; padding:6px 8px;" />
              <button type="button" class="btn-warn" onclick="stopSlotWorker('${def.key}')">اسٹاپ کریں</button>
              <input type="text" id="newName-${def.key}" placeholder="نئے مزدور کا نام..." style="width:150px; padding:6px 8px;" />
              <input type="date" id="newStart-${def.key}" value="${todayStr}" style="width:150px; padding:6px 8px;" />
              <button type="button" class="btn-secondary" onclick="startNewSlotWorker('${def.key}')">نیا اسٹارٹ کریں</button>
            </div>
            ${pastHtml}
          </div>
        `;
      }).join("");
      document.getElementById("totalFactoryPayable").textContent = totalFactoryPayable.toLocaleString();
      document.getElementById("totalWorkerOwes").textContent = totalWorkerOwes.toLocaleString();
      latestComputedSnapshot = { cycleStartDate: cycleData.cycleStartDate, totalFeet, totalWage, totalFactoryPayable, totalWorkerOwes, workers: snapshotWorkers };
      renderFifthHistory();
      reportText = `یوسف خان ماربل فیکٹری (سائیکل شروع: ${cycleData.cycleStartDate})\nورٹیکل+اٹھارہ مشترکہ: ${jointFeet.toLocaleString()} فٹ\nکل فٹ: ${totalFeet.toLocaleString()} | کل اجرت: ${Math.round(totalWage).toLocaleString()} روپے\nفیکٹری کے ذمے بقایا: ${totalFactoryPayable.toLocaleString()} روپے | مزدوروں کے ذمے بقایا: ${totalWorkerOwes.toLocaleString()} روپے\nمزدور وار حساب:\n${reportLines.join("\n") || "• ابھی کوئی مزدور درج نہیں"}`;
    }
    window.saveWorkerAdvance = function (encodedKey) {
      const key = decodeURIComponent(encodedKey);
      const inputEl = document.getElementById("adv-" + encodedKey);
      const amount = parseFloat(inputEl ? inputEl.value : 0) || 0;
      workerAdvances[key] = amount;
      localStorage.setItem(ADVANCE_STORAGE_KEY, JSON.stringify(workerAdvances));
      computeSummary();
      showToast("ایڈوانس / ادائیگی اپڈیٹ ہو گئی۔");
    };
    window.renderProduction = function () {
      const filterEl = document.getElementById("workerFilter");
      const query = (filterEl ? filterEl.value : "").trim().toLowerCase();
      const entries = Object.entries(latestProduction).reverse().filter(([, item]) => {
        if (!query) return true;
        return (item.machine || "").toLowerCase().includes(query) || (item.entryDate || "").toLowerCase().includes(query);
      });
      const prodList = document.getElementById("prodList");
      if (entries.length === 0) { prodList.innerHTML = "<p style='color:#94a3b8'>کوئی ریکارڈ نہیں ملا۔</p>"; return; }
      prodList.innerHTML = entries.map(([id, item]) => {
        const feet = Number(item.feet || 0);
        const wage = Number(item.wage || 0);
        const d = item.entryDate || todayStr;
        let shareInfo = "";
        if (item.machine === "ورٹیکل" || item.machine === "اٹھارہ") shareInfo = `(مشترکہ 4 حصے: ${(feet / 4).toFixed(1)} فٹ / ${Math.round(wage / 4).toLocaleString()} روپے فی بندہ)`;
        else if (item.machine === "سیکشن") {
          const cnt = ["section_1", "section_2"].filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], d)).length || 1;
          shareInfo = `(${cnt} مزدور پر تقسیم: ${(feet / cnt).toFixed(1)} فٹ فی بندہ)`;
        } else if (item.machine === "ریسائز") {
          const cnt = ["resize_1", "resize_2"].filter((k) => isWorkerEligibleOnDate(rosterData.slots[k], d)).length || 1;
          shareInfo = `(${cnt} مزدور پر تقسیم: ${(feet / cnt).toFixed(1)} فٹ فی بندہ)`;
        }
        return `
          <div class="record-item">
            <div>
              <strong style="color:#38bdf8">${item.machine || ""}</strong><span class="record-meta">${shareInfo}</span><span class="record-meta"> — تاریخ: ${d}</span><br/>
              <span>${feet} فٹ × ${item.rate} روپے = <strong>${wage.toLocaleString()} روپے</strong></span>
              <div class="record-meta">${item.createdAt || ""}</div>
            </div>
            <button type="button" class="btn-danger" onclick="deleteProd('${id}')">حذف کریں</button>
          </div>
        `;
      }).join("");
    };
    onValue(cycleRef, (snapshot) => {
      const remoteCycle = snapshot.val();
      if (remoteCycle) {
        cycleData = { cycleStartDate: remoteCycle.cycleStartDate || cycleData.cycleStartDate, fifthStatements: Array.isArray(remoteCycle.fifthStatements) ? remoteCycle.fifthStatements : cycleData.fifthStatements };
        localStorage.setItem(CYCLE_STORAGE_KEY, JSON.stringify(cycleData));
        computeSummary();
      }
    });
    onValue(rosterRef, (snapshot) => {
      const remoteRoster = snapshot.val();
      if (remoteRoster && remoteRoster.slots) {
        rosterData = { ...rosterData, ...remoteRoster, slots: { ...createEmptySlots(), ...rosterData.slots, ...remoteRoster.slots } };
        localStorage.setItem(ROSTER_STORAGE_KEY, JSON.stringify(rosterData));
        populateSlotInputs();
        computeSummary();
      }
    });
    onValue(prodRef, (snapshot) => {
      statusEl.textContent = "لائیو سنک فعال ہے";
      latestProduction = snapshot.val() || {};
      window.renderProduction();
      computeSummary();
    }, () => { statusEl.textContent = "کنکشن میں مسئلہ"; });
    window.deleteProd = async function (id) {
      await remove(ref(db, `marbleFactory/production/${id}`));
      showToast("ریکارڈ حذف کر دیا گیا۔");
    };
    window.copyWhatsappReport = async function () {
      try { await navigator.clipboard.writeText(reportText); showToast("رپورٹ کاپی ہو گئی!"); } catch { showToast("کاپی نہیں ہو سکی۔"); }
    };
    window.shareWhatsappReport = function () {
      window.open("https://wa.me/?text=" + encodeURIComponent(reportText), "_blank");
    };
    window.downloadBackup = function () {
      const payload = { exportedAt: new Date().toISOString(), billingCycle: cycleData, roster: rosterData, production: latestProduction, workerAdvances, secretComplaints: isUnlocked ? latestSecrets : "Locked" };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `yousaf-khan-marble-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("بیک اپ فائل ڈاؤن لوڈ ہو گئی۔");
    };
    document.getElementById("secretForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const dept = document.getElementById("secretDept").value;
      const sender = document.getElementById("secretSender").value.trim() || "گمنام";
      const message = document.getElementById("secretText").value.trim();
      await push(secretRef, { dept, sender, message, status: "زیرِ غور", createdAt: new Date().toLocaleString("ur-PK") });
      e.target.reset();
      showToast("خفیہ پیغام سپروائزر تک پہنچا دیا گیا!");
    });
    function renderSecrets() {
      const el = document.getElementById("secretList");
      if (!isUnlocked) { el.innerHTML = "<p style='color:#94a3b8'>پن درج کریں۔</p>"; return; }
      const items = Object.entries(latestSecrets).reverse();
      if (items.length === 0) { el.innerHTML = "<p style='color:#94a3b8'>کوئی خفیہ شکایت موجود نہیں۔</p>"; return; }
      el.innerHTML = items.map(([id, item]) => {
        const isReviewed = item.status === "دیکھی جا چکی";
        const badgeClass = isReviewed ? "badge-reviewed" : "badge-pending";
        const statusLabel = isReviewed ? "دیکھی جا چکی" : "زیرِ غور";
        return `
          <div class="record-item">
            <div>
              <strong>${item.sender}</strong> (${item.dept}) <span class="${badgeClass}">${statusLabel}</span><br/>
              <p style="margin:6px 0">${item.message}</p>
              <div class="record-meta">${item.createdAt || ""}</div>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button type="button" class="btn-secondary" onclick="toggleSecretStatus('${id}', '${statusLabel}')">${isReviewed ? "زیرِ غور کریں" : "دیکھی جا چکی"}</button>
              <button type="button" class="btn-danger" onclick="deleteSecret('${id}')">حذف کریں</button>
            </div>
          </div>
        `;
      }).join("");
    }
    window.toggleSecretStatus = async function (id, currentStatus) {
      if (!isUnlocked) return;
      const nextStatus = currentStatus === "دیکھی جا چکی" ? "زیرِ غور" : "دیکھی جا چکی";
      await update(ref(db, `marbleFactory/secretComplaints/${id}`), { status: nextStatus });
      showToast(`اسٹیٹس "${nextStatus}" کر دیا گیا۔`);
    };
    window.unlockSecrets = function () {
      const val = document.getElementById("supervisorPinInput").value.trim();
      if (val === SUPERVISOR_PIN) {
        isUnlocked = true;
        document.getElementById("supervisorLockBox").style.display = "none";
        document.getElementById("supervisorUnlockedControls").style.display = "block";
        document.getElementById("supervisorPinInput").value = "";
        renderSecrets();
        showToast("ان لاک ہو گیا۔");
      } else { showToast("غلط پن کوڈ!"); }
    };
    window.lockSecrets = function () {
      isUnlocked = false;
      document.getElementById("supervisorLockBox").style.display = "block";
      document.getElementById("supervisorUnlockedControls").style.display = "none";
      renderSecrets();
    };
    onValue(secretRef, (snapshot) => { latestSecrets = snapshot.val() || {}; renderSecrets(); });
    window.deleteSecret = async function (id) {
      if (!isUnlocked) return;
      await remove(ref(db, `marbleFactory/secretComplaints/${id}`));
      showToast("پیغام حذف کر دیا گیا۔");
    };
    populateSlotInputs();
    computeSummary();
  </script>
</body>
</html>
